<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Flappy Bird</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100vh;
    height: 100dvh;
    background: #1a1a2e;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased;
    position: fixed;
    top: 0;
    left: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
  }

  .menu-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .title {
    color: #fff;
    font-size: clamp(24px, 7vw, 48px);
    text-shadow: 3px 3px 0 #533e2d, -1px -1px 0 #533e2d;
    margin-bottom: 40px;
    letter-spacing: 2px;
    animation: bob 1.5s ease-in-out infinite;
  }

  .difficulty-options {
    display: flex;
    gap: 20px;
    margin-top: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .difficulty-btn {
    padding: 16px 32px;
    font-size: clamp(12px, 3vw, 18px);
    font-family: 'Press Start 2P', monospace;
    border: 3px solid #fff;
    background: transparent;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #333;
    text-decoration: none;
    display: inline-block;
  }

  .difficulty-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.05);
  }

  .difficulty-btn.easy {
    border-color: #4ec0ca;
    color: #4ec0ca;
  }

  .difficulty-btn.easy:hover {
    box-shadow: 0 0 20px #4ec0ca;
  }

  .difficulty-btn.medium {
    border-color: #ffd700;
    color: #ffd700;
  }

  .difficulty-btn.medium:hover {
    box-shadow: 0 0 20px #ffd700;
  }

  .difficulty-btn.nine-ja {
    border-color: #ff6b6b;
    color: #ff6b6b;
  }

  .difficulty-btn.nine-ja:hover {
    box-shadow: 0 0 20px #ff6b6b;
  }

  .subtitle {
    color: #f5deb3;
    font-size: clamp(10px, 4vw, 16px);
    text-shadow: 2px 2px 0 #333;
    margin-top: 30px;
    animation: pulse 1.8s ease-in-out infinite;
  }

  #credit {
    position: absolute;
    bottom: 10px;
    right: 10px;
    font-size: clamp(8px, 2vw, 12px);
    color: #999;
    font-family: 'Press Start 2P', monospace;
    text-shadow: 1px 1px 0 #333;
  }

  #credit a {
    color: #4ec0ca;
    text-decoration: none;
    transition: color 0.3s;
  }

  #credit a:hover {
    color: #5ed9e3;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div class="menu-container">
  <div class="title">FLAPPY BIRD</div>
  <div class="subtitle">SELECT DIFFICULTY</div>
  <div class="difficulty-options">
    <a href="game.html?difficulty=easy" class="difficulty-btn easy">EASY</a>
    <a href="game.html?difficulty=medium" class="difficulty-btn medium">MEDIUM</a>
    <a href="game.html?difficulty=nineJa" class="difficulty-btn nine-ja">9JA MODE</a>
  </div>
</div>

<div id="credit">built by <a href="https://twitter.com/0xfemi" target="_blank" rel="noopener noreferrer">0xfemi</a></div>

</body>
</html>
